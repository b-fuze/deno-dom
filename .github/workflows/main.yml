name: Native plugin

on:
  push:
    paths:
      - "Cargo.toml"
      - "html-parser/core/**"
      - "html-parser/plugin/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "html-parser/core/**"
      - "html-parser/plugin/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The native loader currently publishes x86_64 macOS binaries only.
        os: [macos-15-intel, windows-latest, ubuntu-22.04]

    env:
      GH_ACTIONS: true
      RUST_BACKTRACE: full
      DENO_BUILD_MODE: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
        with:
          rust-version: "1.87.0"

      - name: Log versions
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        env:
          RUST_BACKTRACE: 1
        run: cargo build --release

      - name: Build ARM64 Linux
        if: matrix.os == 'ubuntu-22.04'
        env:
          RUST_BACKTRACE: 1
        shell: bash
        run: |
          # Keep the Linux x86_64 build artifact around since
          # we'll be clearing it to build the ARM64 artifact
          cp target/release/libplugin.so .

          target=aarch64-unknown-linux-gnu
          arm64_cargo_config=$(cat <<CONFIG
          [build]
          target = "$target"
          rustflags = ["-C", "linker=clang", "-C", "link-arg=--target=$target", "-C", "link-arg=-fuse-ld=lld"]
          CONFIG
          )

          install -D <(printf %s "$arm64_cargo_config") .cargo/config.toml
          rustup target add "$target"

          # Add ARM64 Ubuntu repos
          sed -E '
            /^deb/!d;
            s|.+/([^/]+\.txt)?|deb [arch=arm64] http://ports.ubuntu.com/|;
          ' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/sources-arm64.list
          # Mark existing repos as x86_64 only
          for list in /etc/apt/sources.list /etc/apt/*.list; do
            if [[ ! $list =~ arm64 ]]; then
              sudo sed -i -E 's/^deb ([^[])/deb [arch=amd64] \1/' "$list"
            fi
          done
          sudo dpkg --add-architecture arm64
          sudo bash -c 'apt update; true'

          # Install ARM64 deps
          ubuntu_version=$(grep VERSION_ID /etc/os-release | tr -dc '[:digit:].')
          gcc_lib=

          case $ubuntu_version in
            20.04 ) gcc_lib=libgcc-9-dev ;;
            22.04 ) gcc_lib=libgcc-11-dev ;;
            * )
              echo "Unsupported Ubuntu version" >&2
              exit 1
              ;;
          esac

          sudo apt install libgcc-s1:arm64 libc6:arm64 libc6-dev:arm64 "$gcc_lib:arm64" -y

          # Make sure the ARM64 dependency libraries are found by the linker
          (
            cd /usr/lib/aarch64-linux-gnu
            for lib in gcc_s util rt pthread m dl c; do
              for file in lib$lib.so.*; do
                link_path=lib$lib.so
                if [[ -f $file && ! -e $link_path ]]; then
                  sudo ln -s "$file" "$link_path"
                fi
              done
            done
          )

          cargo clean
          cargo build --release

          lib=target/$target/release/libplugin.so
          cp "$lib" "${lib%.so}-linux-aarch64.so"

          # Put the x86_64 build artifact back
          install -D libplugin.so target/release/libplugin.so

      - name: Upload native plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-plugin-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/libplugin.dylib
            target/release/plugin.dll
            target/release/libplugin.so
            target/aarch64-unknown-linux-gnu/release/libplugin-linux-aarch64.so

  release:
    name: Update draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download native plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-plugin-*
          path: release-assets
          merge-multiple: true

      - name: Release Plugin
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release draft"
          draft: true
          files: |
            release-assets/**/libplugin.dylib
            release-assets/**/plugin.dll
            release-assets/**/libplugin.so
            release-assets/**/libplugin-linux-aarch64.so
